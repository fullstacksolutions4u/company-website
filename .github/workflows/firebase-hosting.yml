name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: full-stack-solutions-515503

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build # static export -> ./out

      # Keyless auth: exchanges the GitHub OIDC token for Google credentials.
      # Sets GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools picks up.
      - id: auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy (live)
        if: github.event_name == 'push'
        run: npx --yes firebase-tools deploy --only hosting --project "$PROJECT_ID"

      - name: Deploy (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npx --yes firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" --expires 7d --project "$PROJECT_ID"
